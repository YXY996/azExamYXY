name: Service check-in

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Require service URL
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: test -n "$SERVICE_URL" || { echo "Set repository variable SERVICE_URL after deployment."; exit 1; }
      - name: Check service health
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
        run: curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 "${SERVICE_URL%/}/api/health"
